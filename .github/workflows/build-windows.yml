name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "finance_core.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py finance_core.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LocalFinance --collect-data customtkinter app.py
      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/LocalFinance/* -DestinationPath LocalFinance-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LocalFinance-Windows
          path: LocalFinance-Windows.zip
          if-no-files-found: error
          retention-days: 7
